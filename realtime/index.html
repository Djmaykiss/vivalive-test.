<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VivaLive — Sala real (desarrollo)</title><style>body{font:16px system-ui;background:#0c1020;color:white;max-width:750px;margin:20px auto;padding:14px}h1{color:#ff4a89}section{background:#1b2540;padding:18px;border-radius:14px;margin:14px 0}input,button{padding:12px;margin:5px;border-radius:9px;border:0;font:inherit}input{background:#293651;color:white;max-width:90%}button{background:#f43c82;color:white;cursor:pointer}button:disabled{opacity:.5}video{width:100%;aspect-ratio:16/9;background:black;border-radius:10px}#messages{max-height:180px;overflow:auto}small{color:#bcc6dd}#status{white-space:pre-wrap} .hidden{display:none}.auth-card{max-width:450px;margin:22px auto;background:linear-gradient(155deg,#253252,#171b32);box-shadow:0 15px 45px #0005}.auth-card h2{text-align:center;margin-bottom:4px}.auth-desc{text-align:center;color:#bcc6dd}.auth-card label{display:block;font-size:14px;margin:13px 5px 3px;color:#e9eefa}.auth-card input{display:block;box-sizing:border-box;width:calc(100% - 10px);max-width:none}.auth-tabs{display:flex;gap:8px;margin:20px 0}.auth-tabs .tab{flex:1;background:#333a52;color:#cad2e4}.auth-tabs .tab.active{background:#f43c82;color:white}.auth-primary{width:calc(100% - 10px);font-weight:700;margin-top:18px}#authFeedback{min-height:24px;white-space:pre-wrap;font-size:14px;color:#ffcbda}.auth-card small{display:block;margin:12px 5px;line-height:1.5}</style></head><body><h1>VIVA LIVE</h1><p>Prueba privada de desarrollo: salas públicas sin contenido adulto ni pagos.</p><p id="status">Preparando conexión...</p><section id="auth" class="auth-card"><h2>Únete a VivaLive</h2><p class="auth-desc">Crea tu cuenta para compartir tus directos.</p><div class="auth-tabs"><button type="button" id="signupTab" class="tab active">Crear cuenta</button><button type="button" id="signinTab" class="tab">Iniciar sesión</button></div><div id="nameRow"><label for="name">Nombre de usuario</label><input id="name" autocomplete="nickname" minlength="3" maxlength="40" placeholder="Tu nombre público"></div><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nombre@correo.com"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Al menos 8 caracteres"><div id="confirmRow"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña"></div><button id="signup" class="auth-primary">Registrarme con correo</button><button id="signin" class="auth-primary hidden">Entrar a VivaLive</button><p id="authFeedback" role="status" aria-live="polite"></p><small>Te enviaremos un enlace de confirmación por correo. Esto no verifica identidad ni mayoría de edad.</small></section><section id="panel" class="hidden"><p>Sesión: <b id="who"></b> <button id="signout">Salir</button></p><button id="refresh">Actualizar transmisiones</button><div id="rooms"></div><button id="go">🔴 Iniciar transmisión pública</button></section><section id="stage" class="hidden"><h2 id="stageTitle"></h2><video id="video" autoplay playsinline controls></video><div id="messages"></div><input id="message" placeholder="Comentario"><button id="send">Enviar</button><button id="leave">Finalizar / salir</button><p><small id="hint"></small></p></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.78.0';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';
const E=id=>document.getElementById(id);
const status=x=>E('status').textContent=x;
if(!SUPABASE_URL||!SUPABASE_PUBLISHABLE_KEY){status('Falta configurar un proyecto Supabase exclusivo para VivaLive. Esta versión aún no está operativa.');throw Error('Supabase sin configurar');}
const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null,room=null,channel=null,stream=null,hosting=false,peers=new Map(),viewerPC=null,heartbeat=null,pendingIce=[];
const show=(id,on)=>E(id).classList.toggle('hidden',!on);
const say=(name,message)=>{const p=document.createElement('p');p.textContent=name+': '+message;E('messages').appendChild(p);E('messages').scrollTop=E('messages').scrollHeight;};
const err=e=>status(e?.message||String(e));
async function user(){const {data:{user},error}=await sb.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')console.log(error);me=user?.email_confirmed_at?user:null;show('auth',!me);show('panel',!!me);if(me){E('who').textContent=me.email;await list();status('Correo confirmado. Puedes crear o ver una transmisión.');}else status('Crea una cuenta, confirma el correo e inicia sesión.');}
const authMessage=(message,ok=false)=>{E('authFeedback').textContent=message;E('authFeedback').style.color=ok?'#a4f5c0':'#ffcbda';status(message);};
let authBusy=false;
function authMode(signup){show('nameRow',signup);show('confirmRow',signup);show('signup',signup);show('signin',!signup);E('signupTab').classList.toggle('active',signup);E('signinTab').classList.toggle('active',!signup);E('password').autocomplete=signup?'new-password':'current-password';E('authFeedback').textContent='';}
E('signupTab').onclick=()=>authMode(true);
E('signinTab').onclick=()=>authMode(false);
E('signup').onclick=async()=>{
 if(authBusy)return;
 const email=E('email').value.trim().toLowerCase(),password=E('password').value,name=E('name').value.trim(),confirmation=E('confirmPassword').value;
 if(name.length<3)return authMessage('Escribe un nombre de usuario de al menos 3 caracteres.');
 if(!E('email').checkValidity()||!email)return authMessage('Introduce un correo electrónico válido y real.');
 if(password.length<8)return authMessage('Tu contraseña debe tener al menos 8 caracteres.');
 if(password!==confirmation)return authMessage('Las dos contraseñas no coinciden.');
 authBusy=true;E('signup').disabled=true;authMessage('Creando tu cuenta...');
 try{
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/realtime/',data:{display_name:name}}});
  if(error)throw error;
  if(!data?.user)throw Error('El servidor no confirmó la solicitud. Intenta nuevamente.');
  if(data.user.identities?.length===0)return authMessage('No se pudo crear una cuenta nueva con este correo. Si ya tienes una cuenta, usa Iniciar sesión o recupera tu contraseña.');
  authMessage(data.user.email_confirmed_at?'Cuenta creada. Ya puedes iniciar sesión.':'Solicitud recibida. Revisa tu correo y confirma el enlace antes de iniciar sesión.',true);
 }catch(e){authMessage('No se pudo completar el registro: '+(e?.message||String(e)));}
 finally{authBusy=false;E('signup').disabled=false;}
};
E('signin').onclick=async()=>{
 if(authBusy)return;
 const email=E('email').value.trim(),password=E('password').value;
 if(!email||!password)return authMessage('Introduce tu correo y contraseña.');
 authBusy=true;E('signin').disabled=true;
 try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await user();if(!me)authMessage('Confirma tu correo electrónico antes de entrar.');}
 catch(e){authMessage('No se pudo iniciar sesión: '+(e?.message||String(e)));}
 finally{authBusy=false;E('signin').disabled=false;}
};
E('signout').onclick=async()=>{await leave();await sb.auth.signOut();await user();};
E('refresh').onclick=list;
async function list(){if(!me)return;const {data,error}=await sb.from('vl_rooms').select('id,host_id,host_name,created_at').eq('status','live').gt('heartbeat_at',new Date(Date.now()-70000).toISOString()).order('created_at',{ascending:false});if(error)return err(error);E('rooms').replaceChildren();for(const r of data||[]){const b=document.createElement('button');b.textContent='▶ Ver live de '+r.host_name;b.onclick=()=>watch(r);E('rooms').appendChild(b);}if(!data?.length)E('rooms').textContent='No hay transmisiones activas.';}
const signal=(event,payload)=>channel?.send({type:'broadcast',event,payload});
const rtc=()=>new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
async function listen(id){channel=sb.channel('vl-room:'+id,{config:{private:true,broadcast:{ack:true}}});channel.on('broadcast',{event:'join'},async({payload})=>{if(!hosting||!payload?.viewer||payload.viewer===me.id)return;const viewer=payload.viewer;if(peers.has(viewer))peers.get(viewer).close();const pc=rtc();peers.set(viewer,pc);for(const track of stream.getTracks())pc.addTrack(track,stream);pc.onicecandidate=e=>{if(e.candidate)signal('ice',{target:viewer,from:me.id,candidate:e.candidate.toJSON()});};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signal('offer',{target:viewer,from:me.id,sdp:pc.localDescription});}).on('broadcast',{event:'offer'},async({payload})=>{if(hosting||payload.target!==me.id)return;const pc=viewerPC;if(!pc)return;await pc.setRemoteDescription(payload.sdp);for(const candidate of pendingIce.splice(0))await pc.addIceCandidate(candidate);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await signal('answer',{target:payload.from,from:me.id,sdp:pc.localDescription});}).on('broadcast',{event:'answer'},async({payload})=>{if(!hosting||payload.target!==me.id)return;await peers.get(payload.from)?.setRemoteDescription(payload.sdp);}).on('broadcast',{event:'ice'},async({payload})=>{if(payload.target!==me.id)return;const pc=hosting?peers.get(payload.from):viewerPC;if(!pc)return;if(pc.remoteDescription)await pc.addIceCandidate(payload.candidate);else if(!hosting)pendingIce.push(payload.candidate);}).on('broadcast',{event:'chat'},({payload})=>{say(payload.name||'Usuario',String(payload.text||'').slice(0,500));}).on('broadcast',{event:'ended'},()=>{if(!hosting){status('La transmisión terminó.');leave();}}).subscribe(s=>{if(s==='SUBSCRIBED'&&!hosting)signal('join',{viewer:me.id});if(s==='CHANNEL_ERROR')status('No se pudo abrir el canal de transmisión. Revisa políticas Realtime.');});}
E('go').onclick=async()=>{if(!me)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});hosting=true;await sb.from('vl_rooms').update({status:'ended'}).eq('host_id',me.id).eq('status','live');let {data,error}=await sb.from('vl_rooms').insert({host_id:me.id,host_name:String(me.user_metadata?.display_name||me.email.split('@')[0]).slice(0,40)}).select().single();if(error)throw error;room=data;E('video').muted=true;E('video').srcObject=stream;show('stage',true);show('panel',false);E('stageTitle').textContent='🔴 EN VIVO — '+room.host_name;E('hint').textContent='Abre VivaLive con otra cuenta y pulsa Actualizar transmisiones. WebRTC P2P tiene límite de espectadores y puede requerir TURN.';await listen(room.id);heartbeat=setInterval(async()=>{await sb.from('vl_rooms').update({heartbeat_at:new Date().toISOString()}).eq('id',room.id)},25000);status('Emitiendo cámara y micrófono.');}catch(e){err(e);await leave();}};
async function watch(r){if(!me)return;hosting=false;room=r;show('stage',true);show('panel',false);E('stageTitle').textContent='Viendo a '+r.host_name;E('hint').textContent='Esperando video. Si no conecta, puede faltar un servidor TURN.';viewerPC=rtc();viewerPC.ontrack=e=>{E('video').srcObject=e.streams[0];E('video').muted=false;E('video').play().catch(()=>status('Toca Reproducir para escuchar el video.'));};viewerPC.onicecandidate=e=>{if(e.candidate)signal('ice',{target:room.host_id,from:me.id,candidate:e.candidate.toJSON()});};await listen(r.id);}
E('send').onclick=async()=>{const text=E('message').value.trim().slice(0,500);if(!text||!channel)return;await signal('chat',{name:String(me.user_metadata?.display_name||me.email).slice(0,40),text});E('message').value='';say('Yo',text);};
async function leave(){clearInterval(heartbeat);heartbeat=null;for(const pc of peers.values())pc.close();peers.clear();viewerPC?.close();viewerPC=null;pendingIce=[];if(hosting&&room){await sb.from('vl_rooms').update({status:'ended'}).eq('id',room.id);await signal('ended',{});}if(channel){await sb.removeChannel(channel);channel=null;}stream?.getTracks().forEach(t=>t.stop());stream=null;room=null;hosting=false;E('video').srcObject=null;E('messages').replaceChildren();show('stage',false);show('panel',!!me);if(me)await list();}
E('leave').onclick=leave;window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());});sb.auth.onAuthStateChange(()=>{setTimeout(user,0);});await user();
</script></body></html>
