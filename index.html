function toggleBroadcastMic(){state.muted=!state.muted;state.stream?.getAudioTracks().forEach(track=>track.enabled=!state.muted);const b=document.getElementById('broadcastMic');if(b)b.textContent=state.muted?'🔇 Activar mic.':'🎙️ Micrófono'}
async function flipBroadcastCamera(){if(!state.broadcast)return;let facing=state.broadcastCameraFacing==='user'?'environment':'user';try{const next=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:true});stopCapture();state.stream=next;state.broadcastCameraFacing=facing;if(state.muted)next.getAudioTracks().forEach(x=>x.enabled=false);let v=document.getElementById('broadcastVideo');v.srcObject=next;v.style.transform=facing==='user'?'scaleX(-1)':'none';v.play().catch(()=>{})}catch(e){toast('No fue posible cambiar la cámara: '+(e.name||'error'))}}
function endBroadcast(){if(!state.broadcast)return;const duration=Math.floor((Date.now()-state.broadcastStarted)/1000);state.broadcast=false;stopCapture();document.getElementById('broadcastOverlay')?.remove();render();modal('Resumen de tu live de prueba',`<p>Duración: ${Math.floor(duration/60)} min ${duration%60} s</p><p>Reacciones: ${state.broadcastHearts} · Regalos ficticios: ${state.broadcastGifts}</p><p>Espectadores reales: 0</p><p class="tiny">Tu cámara y micrófono ya están apagados. Esta emisión solo se mostró en este dispositivo.</p><button class="btn primary" data-action="dismiss">Cerrar resumen</button>`)}
document.addEventListener('click',async e=>{let t=e.target.closest('[data-page],[data-filter],[data-live],[data-action],[data-family],[data-restore]');if(!t)return;if(t.dataset.page){setPage(t.dataset.page)}else if(t.dataset.filter){state.filter=t.dataset.filter;render()}else if(t.dataset.live){live(+t.dataset.live)}else if(t.dataset.restore){live(state.mini)}else if(t.dataset.family){let i=+t.dataset.family;if(state.family.includes(i)){state.family=state.family.filter(x=>x!==i);toast('Saliste de la familia de prueba')}else{state.family.push(i);toast('Te uniste a la familia de prueba')}save();render()}else{const a=t.dataset.action;if(a==='dismiss')t.closest('.modal')?.remove();if(a==='logout'){if(state.broadcast)endBroadcast();sessionStorage.removeItem('vivaliveDemoAccount');state.account=null;state.verified=false;state.adult=false;if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}document.getElementById('liveOverlay')?.remove();render();toast('Sesión de prueba cerrada')}if(a==='terms')modal('Reglas de VivaLive — prueba','<p>Solo adultos mayores de 18 años. Prohibidos menores, contenido sin consentimiento, acoso, explotación, fraude, suplantación y distribución de contenido privado ajeno. Podrás denunciar y bloquear usuarios. Para lanzar el servicio se redactarán términos legales completos y una política de privacidad.</p><p class="tiny">Esta es una descripción provisional de reglas, no el contrato legal final.</p>');if(a==='adult'){state.adult=!state.adult;render()}if(a==='demo-age'){modal('Verificación de edad pendiente','<p>La fecha declarada en el registro no sustituye una verificación de edad o identidad. Para acceder a contenido adulto real se integrará un proveedor especializado.</p>')}if(a==='camera')await camera();if(a==='flip'){state.facing=state.facing==='environment'?'user':'environment';if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;await camera()}else toast('Activa primero la cámara')}if(a==='start-live')await startBroadcast();if(a==='end-broadcast')endBroadcast();if(a==='toggle-mic')toggleBroadcastMic();if(a==='broadcast-flip')await flipBroadcastCamera();if(a==='broadcast-heart'){state.broadcastHearts++;updateBroadcastCounters();toast('❤️ Reacción de prueba')};if(a==='broadcast-gift'){state.broadcastGifts++;updateBroadcastCounters();toast('🎁 Regalo de prueba (sin cobro)')};if(a==='broadcast-chat'){sendBroadcastChat()}if(a==='minimize')closeLive(true);if(a==='close-mini'){state.mini=null;render()}if(a==='follow'){let i=state.active;state.following=state.following.includes(i)?state.following.filter(x=>x!==i):[...state.following,i];save();closeLive(false);live(i)}if(a==='send'){let input=document.getElementById('chatInput'),v=input?.value.trim();if(v&&state.active!==null){const chat=state.chatsByLive[state.active]??(state.chatsByLive[state.active]=[]);chat.push(state.profile+': '+v);document.getElementById('liveChat').innerHTML=chat.slice(-3).map(x=>`<p>${esc(x)}</p>`).join('');input.value=''}}if(a==='gifts')modal('🎁 Regalos de prueba',`<p>Saldo: ${state.coins} monedas ficticias.</p>${[['🌹 Rosa',10],['❤️ Corazón',50],['👑 Corona',500]].map(g=>`<button class="btn" data-action="gift" data-value="${g[1]}">${g[0]} · ${g[1]}</button>`).join('')}<p class="tiny">No se mueve dinero real.</p>`);if(a==='gift'){let n=+t.dataset.value;if(state.coins<n)toast('Saldo insuficiente');else{state.coins-=n;t.closest('.modal')?.remove();toast('Regalo enviado en simulación: '+n+' monedas')}}if(a==='guest')modal('👥 Invitados','<p>Las solicitudes de invitado estarán conectadas cuando exista un servidor de salas.</p><button class="btn" data-action="request">Enviar solicitud ficticia</button>');if(a==='request'){t.closest('.modal')?.remove();toast('Solicitud ficticia enviada')};if(a==='battle')modal('⚔️ Batalla PK de prueba','<p>Creador A vs. Creador B</p><div class="meter"><span></span><span></span></div><p class="tiny">57 % — 43 % · Marcador ilustrativo, sin rivales conectados.</p>');if(a==='report')modal('⚑ Denuncia de prueba','<p>Las denuncias reales requieren cuentas y un equipo de seguridad.</p><select class="field"><option>Comportamiento abusivo</option><option>Suplantación</option><option>Contenido ilegal</option></select><button class="btn primary" data-action="report-demo">Enviar prueba</button>');if(a==='report-demo'){t.closest('.modal')?.remove();toast('Denuncia de prueba recibida localmente')};if(a==='topup'){state.coins+=1000;toast('Añadidas 1,000 monedas ficticias');render()}if(a==='save-name'){state.profile=document.getElementById('name').value.trim().slice(0,35)||'Invitado';save();render()}}});document.addEventListener('submit',e=>{if(e.target.id!=='register-form')return;e.preventDefault();const username=document.getElementById('reg-name').value.trim(),email=document.getElementById('reg-email').value.trim(),pass=document.getElementById('reg-pass').value,birth=document.getElementById('reg-birth').value;const dob=new Date(birth+'T12:00:00');const today=new Date();let age=today.getFullYear()-dob.getFullYear();if(today.getMonth()<dob.getMonth()||(today.getMonth()===dob.getMonth()&&today.getDate()<dob.getDate()))age--;if(!birth||Number.isNaN(dob.getTime())||age<18){authScreen('Para usar VivaLive debes tener al menos 18 años.');return}if(username.length<3||pass.length<8||!email.includes('@')){authScreen('Revisa el nombre, correo y contraseña de prueba.');return}if(!document.getElementById('reg-terms').checked||!document.getElementById('reg-adult').checked){authScreen('Debes aceptar las condiciones y confirmar tu mayoría de edad.');return}state.account={username,email,createdAt:new Date().toISOString(),ageDeclared:true};state.profile=username;sessionStorage.setItem('vivaliveDemoAccount',JSON.stringify(state.account));state.verified=false;state.adult=false;render();toast('Cuenta de demostración creada. Edad declarada, no verificada.')});document.addEventListener('input',e=>{if(e.target.id==='brightness'){const v=document.getElementById('cam');if(v)v.style.filter=`brightness(${e.target.value}%)`}});render();
